name: Build Status

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - LICENSE
      - README.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions-ext/python/setup@6e1b91a408ea89f49bc8aff8724f83826f7b5446
        with:
          version: "3.11"

      - name: Setup Rust
        uses: actions-ext/rust/setup@3de300f3071e758a1dd8545b884288a35e5d7f81

      - name: Install dependencies
        run: make develop

      - name: Lint
        run: make lint

      - name: Checks
        run: make checks
        if: matrix.os == 'ubuntu-latest'

      - name: Test native package consumers
        run: |
          cmake -S . -B "${{ runner.temp }}/finance-enums-native" -DFINANCE_ENUMS_BUILD_SHARED=ON -DFINANCE_ENUMS_BUILD_STATIC=OFF -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/finance-enums-prefix"
          cmake --build "${{ runner.temp }}/finance-enums-native" --config Release
          cmake --install "${{ runner.temp }}/finance-enums-native" --config Release
          cmake -S tests/native_consumer -B "${{ runner.temp }}/finance-enums-consumer" -DCMAKE_PREFIX_PATH="${{ runner.temp }}/finance-enums-prefix"
          cmake --build "${{ runner.temp }}/finance-enums-consumer" --config Release
          ctest --test-dir "${{ runner.temp }}/finance-enums-consumer" -C Release --output-on-failure
        shell: bash

      - name: Test pkg-config metadata
        run: PKG_CONFIG_PATH="${{ runner.temp }}/finance-enums-prefix/lib/pkgconfig" pkg-config --exists finance-enums
        shell: bash
        if: matrix.os != 'windows-latest'

      - name: Build
        run: make build

      - name: Test
        run: make coverage

      - name: Upload test results (Python)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: '**/junit.xml'
        if: always()

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        with:
          files: '**/junit.xml'
        if: matrix.os == 'ubuntu-latest'

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
        with:
          platforms: all
        if: runner.os == 'Linux' && runner.arch == 'X64'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /
        shell: bash
        if: matrix.os == 'ubuntu-latest'

      - name: Build distributions (Linux)
        run: |
          rm -rf dist
          make dist-rs
          make dist-py-sdist
          make dist-py-wheel
          make dist-check
        shell: bash
        if: matrix.os == 'ubuntu-latest'

      - name: Build distributions (macOS/Windows)
        run: |
          rm -rf dist
          make dist-py-wheel
          make dist-check
        shell: bash
        env:
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
        if: matrix.os != 'ubuntu-latest'

      - name: Test wheel
        uses: actions-ext/python/test-wheel@6e1b91a408ea89f49bc8aff8724f83826f7b5446
        with:
          module: finance_enums
        if: matrix.os == 'ubuntu-latest'

      - name: Test wheel SDK layout
        run: python scripts/smoke_test_wheel.py dist

      - name: Test split Python wheel
        run: |
          FINANCE_ENUMS_SKIP_SHARED_LIBRARY=1 python -m build --wheel --no-isolation --outdir dist/split
          python scripts/smoke_test_wheel.py dist/split --split
        shell: bash
        if: matrix.os == 'ubuntu-latest'

      - name: Test source distribution
        uses: actions-ext/python/test-sdist@6e1b91a408ea89f49bc8aff8724f83826f7b5446
        with:
          module: finance_enums
        if: matrix.os == 'ubuntu-latest'

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ matrix.os }}
          path: dist

  conda:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install rattler-build
        run: |
          curl -fsSL https://github.com/prefix-dev/rattler-build/releases/download/v0.73.0/rattler-build-x86_64-unknown-linux-musl -o "${{ runner.temp }}/rattler-build"
          echo "34f540732796dd4dea9d6273017b68ebec3a753e6ee71a9b6458e836cafdc1d0  ${{ runner.temp }}/rattler-build" | sha256sum --check
          chmod +x "${{ runner.temp }}/rattler-build"

      - name: Build and test split conda packages
        run: |
          "${{ runner.temp }}/rattler-build" build --recipe conda/recipe.yaml --channel conda-forge --output-dir "${{ runner.temp }}/conda-output"

  vcpkg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: actions-ext/rust/setup@3de300f3071e758a1dd8545b884288a35e5d7f81

      - name: Bootstrap vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "${{ runner.temp }}/vcpkg"
          git -C "${{ runner.temp }}/vcpkg" checkout da411b1cfb549469ae350136f954deed7ad8c650
          "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Build and test overlay port
        run: |
          "${{ runner.temp }}/vcpkg/vcpkg" install finance-enums --classic --overlay-ports="${{ github.workspace }}/ports" --triplet x64-linux-dynamic
          cmake -S tests/native_consumer -B "${{ runner.temp }}/vcpkg-consumer" -DCMAKE_TOOLCHAIN_FILE="${{ runner.temp }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-linux-dynamic
          cmake --build "${{ runner.temp }}/vcpkg-consumer" --config Release
          ctest --test-dir "${{ runner.temp }}/vcpkg-consumer" -C Release --output-on-failure
