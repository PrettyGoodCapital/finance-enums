[package]
name = "finance_enums_py"
version = "0.9.1"
edition = "2021"
publish = false

[lib]
name = "_finance_enums"
path = "rust/python/lib.rs"
crate-type = ["cdylib"]

[dependencies]
finance_enums = { path = "./rust", version = "*", optional = true, features = ["capi"] }
pyo3 = { version = "0.30.1", features = ["abi3", "extension-module", "multiple-pymethods"] }

[features]
default = ["direct"]
capi = []
direct = ["dep:finance_enums"]

[profile.release]
panic = 'abort'
lto = true
