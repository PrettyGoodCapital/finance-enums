[build-system]
requires = [
    "hatchling",
    "hatch-rs>=0.6.1",
]
build-backend = "hatchling.build"

[project]
name = "finance-enums"
authors = [
    {name = "PrettyGoodCapital", email = "prettygoodcapital@gmail.com"},
]
description = "Standard financial enumerations"
readme = "README.md"
license = { text = "Apache-2.0" }
version = "0.8.0"
requires-python = ">=3.10"
keywords = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = []

[project.optional-dependencies]
develop = [
    "build",
    "bump-my-version",
    "check-dist",
    "cibuildwheel",
    "codespell",
    "hatch-rs>=0.6.1",
    "hatchling",
    "mdformat",
    "mdformat-myst",
    "mdformat-tables>=1",
    "polars",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "ty",
    "uv",
    "wheel",
    "yardang",
    # tests
    "tomli; python_version < '3.11'",
]

[project.scripts]

[project.urls]
Repository = "https://github.com/prettygoodcapital/finance-enums"
Homepage = "https://github.com/prettygoodcapital/finance-enums"

[tool.bumpversion]
current_version = "0.8.0"
commit = true
tag = false
commit_args = "-s"
pre_commit_hooks = [
    "cargo update --workspace",
    "cargo update --manifest-path rust/Cargo.toml --workspace",
    "git add Cargo.lock rust/Cargo.lock",
]

[[tool.bumpversion.files]]
filename = "finance_enums/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "rust/Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "rust/capi/Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "rust/abi_safe_enum/Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "rust/abi_safe_enum_macros/Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "vcpkg.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "reference_snapshots/abi.json"
search = '"release": "{current_version}"'
replace = '"release": "{new_version}"'

[[tool.bumpversion.files]]
filename = "reference_snapshots/abi.json"
search = '"semantic_abi": [{current_major}, {current_minor}, {current_patch}]'
replace = '"semantic_abi": [{new_major}, {new_minor}, {new_patch}]'

[[tool.bumpversion.files]]
filename = "ports/finance-enums/vcpkg.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "CMakeLists.txt"
search = "VERSION {current_version}"
replace = "VERSION {new_version}"

[[tool.bumpversion.files]]
filename = "conda/recipe.yaml"
search = "version: {current_version}"
replace = "version: {new_version}"

[[tool.bumpversion.files]]
filename = "tests/native_consumer/CMakeLists.txt"
search = 'set(FINANCE_ENUMS_REQUIRED_VERSION "{current_major}.{current_minor}"'
replace = 'set(FINANCE_ENUMS_REQUIRED_VERSION "{new_major}.{new_minor}"'

# Keep the semantic enum-data ABI version (negotiated via abi_version() /
# abi_compatible()) in lockstep with the package version. The struct-layout
# discriminators (*_EXPORT_ABI_VERSION) are intentionally left out — they track
# the binary export-struct shape, not the release version.
[[tool.bumpversion.files]]
filename = "rust/src/enum_data.rs"
search = "ENUM_ABI_VERSION_MAJOR: u32 = {current_major}"
replace = "ENUM_ABI_VERSION_MAJOR: u32 = {new_major}"

[[tool.bumpversion.files]]
filename = "rust/src/enum_data.rs"
search = "ENUM_ABI_VERSION_MINOR: u32 = {current_minor}"
replace = "ENUM_ABI_VERSION_MINOR: u32 = {new_minor}"

[[tool.bumpversion.files]]
filename = "rust/src/enum_data.rs"
search = "ENUM_ABI_VERSION_PATCH: u32 = {current_patch}"
replace = "ENUM_ABI_VERSION_PATCH: u32 = {new_patch}"

[[tool.bumpversion.files]]
filename = "rust/capi/src/lib.rs"
search = "FINANCE_ENUMS_ABI_VERSION_MAJOR: u32 = {current_major}"
replace = "FINANCE_ENUMS_ABI_VERSION_MAJOR: u32 = {new_major}"

[[tool.bumpversion.files]]
filename = "rust/capi/src/lib.rs"
search = "FINANCE_ENUMS_ABI_VERSION_MINOR: u32 = {current_minor}"
replace = "FINANCE_ENUMS_ABI_VERSION_MINOR: u32 = {new_minor}"

[[tool.bumpversion.files]]
filename = "rust/capi/src/lib.rs"
search = "FINANCE_ENUMS_ABI_VERSION_PATCH: u32 = {current_patch}"
replace = "FINANCE_ENUMS_ABI_VERSION_PATCH: u32 = {new_patch}"

# The checked-in cbindgen header must match the constants above; `make lint-rs` diffs it.
[[tool.bumpversion.files]]
filename = "rust/capi/include/finance_enums.h"
search = "#define FINANCE_ENUMS_ABI_VERSION_MAJOR {current_major}"
replace = "#define FINANCE_ENUMS_ABI_VERSION_MAJOR {new_major}"

[[tool.bumpversion.files]]
filename = "rust/capi/include/finance_enums.h"
search = "#define FINANCE_ENUMS_ABI_VERSION_MINOR {current_minor}"
replace = "#define FINANCE_ENUMS_ABI_VERSION_MINOR {new_minor}"

[[tool.bumpversion.files]]
filename = "rust/capi/include/finance_enums.h"
search = "#define FINANCE_ENUMS_ABI_VERSION_PATCH {current_patch}"
replace = "#define FINANCE_ENUMS_ABI_VERSION_PATCH {new_patch}"

[tool.cibuildwheel]
build = "cp311-*"
test-command = "pytest -vvv {project}/finance_enums/tests"
test-extras = "develop"

[tool.cibuildwheel.linux]
before-all = """
curl https://sh.rustup.rs -sSf | sh -s -- --default-toolchain=stable --profile=minimal -y
rustup target add aarch64-unknown-linux-gnu
rustup target add x86_64-unknown-linux-gnu
rustup show
"""
before-build = "cargo clean --manifest-path {package}/Cargo.toml && rm -f {package}/finance_enums/*.so"
environment = {PATH="$HOME/.cargo/bin:$PATH", CARGO_TERM_COLOR="always"}
skip = "*i686* *musllinux*"
# Keep the bundled C ABI library where the extension's rpath expects it.
repair-wheel-command = "auditwheel repair --exclude 'libfinance_enums.so*' -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
environment = {PATH="$HOME/.cargo/bin:$PATH", CARGO_TERM_COLOR="always", MACOS_DEPLOYMENT_TARGET=11.0}
archs = "arm64"
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} --exclude finance_enums -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
environment = {PATH="$UserProfile\\.cargo\bin;$PATH", CARGO_TERM_COLOR="always"}
skip = "*win32 *arm64"
# The C ABI library ships inside the wheel; delvewheel must not look for it on PATH.
repair-wheel-command = "delvewheel repair --exclude finance_enums.dll -w {dest_dir} {wheel}"

[tool.codespell]
ignore-words-list = "accreting"

[tool.coverage.run]
branch = true
omit = [
    "finance_enums/tests/integration/*",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
fail_under = 50

[tool.hatch.build.sources]
src = "/"

[tool.hatch.build.hooks.hatch-rs]
verbose = true
abi3 = true
module = "finance_enums"
path = "."
target-dir = "isolated"

# libfinance_enums: the C ABI library, shipped under finance_enums/lib with its headers.
[[tool.hatch.build.hooks.hatch-rs.artifacts]]
name = "finance_enums"
manifest = "rust/capi/Cargo.toml"
destination = "finance_enums/lib/{shared_library}"
expected-symbols = ["finance_enums_currency_export_v1", "finance_enums_exchange_export_v1", "finance_enums_enum_export_v1", "finance_enums_abi_version", "finance_enums_abi_compatible"]
expected-headers = [
    "rust/capi/include/finance_enums.h",
    "rust/capi/include/finance_enums.hpp",
    "rust/capi/include/finance_enums_convert.hpp",
    "rust/capi/include/finance_enums_generated.h",
]
header-symbol-prefix = "finance_enums_"
expected-abi-strings = ["FINANCE_ENUMS_CURRENCY_EXPORT_ABI_VERSION", "FINANCE_ENUMS_EXCHANGE_EXPORT_ABI_VERSION", "FINANCE_ENUMS_ENUM_EXPORT_ABI_VERSION", "FINANCE_ENUMS_ABI_VERSION_MAJOR"]
include-import-lib = true
validate = true

[[tool.hatch.build.hooks.hatch-rs.artifacts.outputs]]
source = "rust/capi/include/finance_enums.h"
destination = "finance_enums/include/finance_enums/finance_enums.h"
install-scheme = "package"

[[tool.hatch.build.hooks.hatch-rs.artifacts.outputs]]
source = "rust/capi/include/finance_enums.hpp"
destination = "finance_enums/include/finance_enums/finance_enums.hpp"
install-scheme = "package"

[[tool.hatch.build.hooks.hatch-rs.artifacts.outputs]]
source = "rust/capi/include/finance_enums_convert.hpp"
destination = "finance_enums/include/finance_enums/finance_enums_convert.hpp"
install-scheme = "package"

[[tool.hatch.build.hooks.hatch-rs.artifacts.outputs]]
source = "rust/capi/include/finance_enums_generated.h"
destination = "finance_enums/include/finance_enums/finance_enums_generated.h"
install-scheme = "package"

# The PyO3 extension, linked against libfinance_enums by default (library-source = bundled).
# HATCH_RS_LIBRARY_SOURCE=external links an installed libfinance-enums instead (the conda
# split build); static or direct links the library's Rust crate into the extension.
[[tool.hatch.build.hooks.hatch-rs.artifacts]]
name = "_finance_enums"
manifest = "Cargo.toml"
destination = "finance_enums/{python_extension_name}"
links = ["finance_enums"]

[tool.hatch.build.hooks.hatch-rs.artifacts.library-source-features]
bundled = ["capi"]
external = ["capi"]
static = ["direct"]
direct = ["direct"]

[tool.hatch.build.targets.sdist]
packages = [
    "finance_enums",
    "rust",
    "Cargo.toml",
    "Cargo.lock",
]
exclude = [
    "*.dll",
    "*.dylib",
    "*.so",
    "*.pyd",
    "rust/Makefile",
    "target",
]

[tool.hatch.build.targets.wheel]
artifacts = [
    "finance_enums/*.dll",
    "finance_enums/*.dylib",
    "finance_enums/*.so",
    "finance_enums/include/**/*.h",
    "finance_enums/include/**/*.hpp",
    "finance_enums/lib/*",
]
packages = [
    "finance_enums",
]
exclude = [
    "rust",
]

[tool.pytest.ini_options]
addopts = [
    "-vvv",
    "--junitxml=junit.xml",
]
testpaths = "finance_enums/tests"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "finance_enums",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "F403",
]

[tool.yardang]
title = "finance enums"
root = "README.md"
pages = [
    "docs/src/ENUMS.md",
    "docs/src/API.md",
]
use-autoapi = false
